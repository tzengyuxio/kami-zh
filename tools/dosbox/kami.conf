# DOSBox-X profile for 神々の大地 ～古事記外伝～ (DOS/V).
#
# The game is a DOS/V title: it draws kanji through the DOS/V display driver
# rather than a PC-98 kanji ROM, so DOSBox-X must run in Japanese DOS/V mode
# (dosv=jp) on a VGA-class card.
#
# `config -avistart` records the screen from inside DOS, which is the only
# capture path that needs no host screen-recording permission. Combine with
# `-time-limit <seconds>` to end the run unattended:
#
#   dosbox-x -conf tools/dosbox/kami.conf -nopromptfolder -fastlaunch \
#            -time-limit 45 -exit
#
# Mount ./build, never ./game -- patch into build/ and leave the original
# copy untouched.

[sdl]
autolock = false

[dosbox]
machine = svga_s3
captures = build/captures

[dosv]
# dosv lives in its own section -- putting it under [dos] is silently ignored
# and the game then draws its windows with no text in them.
dosv = jp
getsysfont = true

[dos]
country = 81

[cpu]
cputype = 386
cycles = 20000

[autoexec]
mount c build
c:
cd KAMI
config -avistart
KAMI.COM
