# DOSBox-X profile for 神々の大地 ～古事記外伝～ (DOS/V).
#
# The game is a DOS/V title: it draws kanji through the DOS/V display driver
# rather than a PC-98 kanji ROM, so DOSBox-X must run in Japanese DOS/V mode
# (dosv=jp) on a VGA-class card.
#
# Usage:  dosbox-x -conf tools/dosbox/kami.conf
# The autoexec mounts ./build as C: -- patch into build/ first, never into
# the pristine game/ copy.

[sdl]
autolock = false

[dosbox]
machine = svga_s3
captures = build/captures

[dos]
dosv = jp
country = 81

[cpu]
cputype = 386
cycles = 20000

[autoexec]
mount c build
c:
cd KAMI
