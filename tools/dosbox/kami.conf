# DOSBox-X profile for 神々の大地 ～古事記外伝～ (DOS/V).
#
# The game is a DOS/V title: it draws kanji through the DOS/V display driver
# rather than a PC-98 kanji ROM, so DOSBox-X must run in Japanese DOS/V mode
# (dosv=jp) on a VGA-class card.
#
# Launch through tools/dosbox/run.sh, which appends the [autoexec] lines --
# they need an absolute path to the repo and two floppy images built at
# startup. Mounting ./build, never ./game, keeps the original copy clean.

[sdl]
autolock = false

[dosbox]
machine = svga_s3
captures = build/captures
# The game cannot save inside dungeons, and the DOSBox-X menu bar can freeze
# the app on macOS, so snapshot automatically: every 60 s, rotating through
# slots 11-20 (save/11.sav ... save/20.sav); slots 1-10 stay for manual use.
autosave = 60 11-20

[dosv]
# dosv lives in its own section -- putting it under [dos] is silently ignored
# and the game then draws its windows with no text in them.
dosv = jp
getsysfont = true

[dos]
country = 81

[cpu]
cputype = 386
cycles = 20000

[autoexec]
