# DOSBox-X config for the Traditional Chinese 神々の大地.
# Edit the "mount c" line to the folder that contains KAMI_ZH, then start:
#   dosbox-x -conf kami-zh.conf
[sdl]
autolock = false

[dosbox]
machine = svga_s3

[dosv]
dosv = jp
getsysfont = true

[dos]
country = 81

[cpu]
cputype = 386
cycles = 20000

[autoexec]
mount c "C:\Games"
c:
imgmake da.img -t fd_1440 > nul
imgmake db.img -t fd_1440 > nul
imgmount a c:\da.img -t floppy
imgmount b c:\db.img -t floppy
copy c:\KAMI_ZH\BDISK.VER a:\ > nul
cd KAMI_ZH
KAMI.COM
